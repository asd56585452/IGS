data:

  data_cls: igs.data.infer_data.N3dDataset
  data:
    background_color: [1.0, 1.0, 1.0]
    data_path: "4K_Actor1_Greeting_total_50_interval_5.json"

    input_height: 512
    input_width: 512

    root_dir: "/home/tsaichenghan/IGS/dataset"

    gs_mode: "test"
    # gs_mode: "start_gs"
    # Note: user conversion put sparse/0. Check if start_gs exists or if we should use valid path.
    # The reference uses 'start_gs' and 'iteration_6000_compress'.
    # User asked to use 'iteration_6000_compress' in previous turn for bbox.
    # Path verified: /home/tsaichenghan/IGS/dataset/hifi4g/colmap_0/test/point_cloud/iteration_6000_compress/point_cloud.ply
    # The path template in config is: ${data.data.root_dir}/<scene>/colmap_0/...
    # But root_dir is .../dataset/hifi4g.
    # So start_gs_path needs to be adjusted.
    
    iter: "6000_compress"
    # The path verified was colmap_0/test/point_cloud/iteration_6000_compress/point_cloud.ply
    # If gs_mode is part of the path...
    
    scene_type: "hifi4g"
    need_rays: True
    max_sh_degree: 3
    # Absolute path logic based on verified file:
    # /home/tsaichenghan/IGS/dataset/hifi4g/colmap_0/test/point_cloud/iteration_6000_compress/point_cloud.ply
    
    # We can hardcode start_gs_path to match exactly what we found
    start_gs_path: "${data.data.root_dir}/4K_Actor1_Greeting/colmap_0/${data.data.gs_mode}/point_cloud/iteration_${data.data.iter}/point_cloud.ply"

opt:
  lambda_lpips: 0
  gradient_clip: 1.0
  lambda_depth: 0
  lambda_normal: 0.1

  free_view: true # or false depending on need, verify implies usually false unless specifically requested, but keeping default true is fine.


  debug: False
  project: "igs"
  exp_name : "test_4K_Actor1_Greeting"

  workspace: 'logs/${opt.project}/${opt.exp_name}/test_4K_Actor1_Greeting_50'

  resume_path: "igs"
  resume_epoch: 15

  resume: 'ckpt/${opt.resume_path}/${opt.resume_epoch}/pytorch_model.bin'
  resume_cfg: 'ckpt/${opt.resume_path}/experiment_config.yaml'

  export_mesh: false
  eval_batch_size: 5

  stream_eval: false
  stream_eval_batch: true

  refine_gs: True
  gs_model_cls: igs.models.gaussian_model.GaussianModel
  use_ntc: False
  use_anchor: False

  #densify 相关
  use_densify: True
  densify_until_iter: 100
  densify_from_iter: 0
  densification_interval: 20
  densify_grad_threshold: 0.00015
  max_num: 150000

  gs_model:
    sh_degree: 3
  training_lr: 
    position_lr_init : 0.0016
    feature_lr : 0.0025
    opacity_lr : 0.05
    scaling_lr : 0.005
    rotation_lr : 0.01
  
  refine_iterations: 50

  lambda_l1: 0.8
  
  refine_item:
    no_shs: False
    no_opacity: False
    no_scaling: False
    use_mask: False
    use_new_shs: False
